<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="anvilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7a8a"/>
      <stop offset="100%" style="stop-color:#3d4a5a"/>
    </linearGradient>
    <linearGradient id="hammerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6914"/>
      <stop offset="100%" style="stop-color:#5c4a0f"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9aa5b0"/>
      <stop offset="100%" style="stop-color:#5a6570"/>
    </linearGradient>
  </defs>
  
  <!-- Anvil base -->
  <path d="M10 54 L14 46 L50 46 L54 54 L10 54 Z" fill="url(#anvilGrad)" stroke="#2a3540" stroke-width="1.5"/>
  
  <!-- Anvil body -->
  <path d="M16 46 L16 36 L48 36 L48 46 Z" fill="url(#anvilGrad)" stroke="#2a3540" stroke-width="1.5"/>
  
  <!-- Anvil face (top surface) -->
  <path d="M12 36 L12 32 L52 32 L52 36 L12 36 Z" fill="#5a6a7a" stroke="#2a3540" stroke-width="1.5"/>
  
  <!-- Anvil horn (left) -->
  <path d="M12 32 L4 34 L12 36 Z" fill="url(#anvilGrad)" stroke="#2a3540" stroke-width="1.5"/>
  
  <!-- Anvil heel (right) -->
  <path d="M52 32 L60 32 L60 36 L52 36 Z" fill="url(#anvilGrad)" stroke="#2a3540" stroke-width="1.5"/>
  
  <!-- Hammer handle -->
  <rect x="38" y="8" width="4" height="22" rx="1" fill="url(#hammerGrad)" stroke="#3d2a08" stroke-width="1" transform="rotate(-35 40 19)"/>
  
  <!-- Hammer head -->
  <rect x="28" y="4" width="16" height="8" rx="2" fill="url(#steelGrad)" stroke="#3a4550" stroke-width="1.5" transform="rotate(-35 36 8)"/>
</svg>
