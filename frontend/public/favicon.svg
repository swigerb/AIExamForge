<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="anvilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a6a7a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3d4a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a3540;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0088aa;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Anvil base -->
  <path d="M8 52 L12 44 L52 44 L56 52 L8 52 Z" fill="url(#anvilGrad)" stroke="#1a2530" stroke-width="1"/>
  
  <!-- Anvil body -->
  <path d="M14 44 L14 32 L50 32 L50 44 Z" fill="url(#anvilGrad)" stroke="#1a2530" stroke-width="1"/>
  
  <!-- Anvil face (top working surface) -->
  <path d="M10 32 L10 28 L54 28 L54 32 L10 32 Z" fill="#4a5a6a" stroke="#1a2530" stroke-width="1"/>
  
  <!-- Anvil horn (left point) -->
  <path d="M10 28 L2 30 L10 32 Z" fill="url(#anvilGrad)" stroke="#1a2530" stroke-width="1"/>
  
  <!-- Anvil heel (right extension) -->
  <path d="M54 28 L60 28 L60 32 L54 32 Z" fill="url(#anvilGrad)" stroke="#1a2530" stroke-width="1"/>
  
  <!-- Glowing top surface -->
  <rect x="12" y="26" width="40" height="3" fill="url(#glowGrad)" rx="1" opacity="0.6"/>
  
  <!-- Sparks -->
  <circle cx="20" cy="18" r="2" fill="url(#sparkGrad)"/>
  <circle cx="32" cy="12" r="2.5" fill="url(#sparkGrad)"/>
  <circle cx="44" cy="16" r="2" fill="url(#sparkGrad)"/>
  <circle cx="26" cy="8" r="1.5" fill="url(#sparkGrad)"/>
  <circle cx="38" cy="6" r="1.5" fill="url(#sparkGrad)"/>
  
  <!-- Spark lines -->
  <line x1="32" y1="24" x2="20" y2="18" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="24" x2="32" y2="12" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="24" x2="44" y2="16" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
</svg>
